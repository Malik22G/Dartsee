services:
  - type: web
    name: dartsee-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dartsee-db
          property: connectionString

databases:
  - name: dartsee-db
    region: oregon
    databaseName: darts_analytics
    user: dartsee_user
    plan: free
